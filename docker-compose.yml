# Local infrastructure for development and manual testing.
#   docker compose up -d db
services:
  db:
    image: postgres:16-alpine
    container_name: coupons-db
    environment:
      POSTGRES_DB: coupons
      POSTGRES_USER: coupons
      POSTGRES_PASSWORD: coupons
    ports:
      - "5432:5432"
    volumes:
      - coupons-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U coupons -d coupons"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  coupons-db-data:
